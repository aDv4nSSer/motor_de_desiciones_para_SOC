# PROPUESTA (H56) — NO DESPLEGADA. Drop-in de hardening para cowrie.service en .139.
# Instalación, solo con OK explícito de Antonio:
#   /etc/systemd/system/cowrie.service.d/hardening.conf
#   systemctl daemon-reload && systemctl restart cowrie
#   verificar: systemctl status cowrie; ss -tlnp | grep 2223; systemd-analyze security cowrie
# Motivo: Cowrie corre como usuario sin privilegios, pero en el mismo host que el
# bastion, Suricata y el Wazuh Manager, y el unit no tiene ningún sandboxing de
# systemd (NoNewPrivileges/ProtectSystem/ProtectHome/PrivateTmp en "no",
# capability set completo). Escucha en 2223 (> 1024): no necesita capabilities.
# Riesgo de la propuesta: si Cowrie escribe fuera de /home/cowrie/cowrie (logs,
# descargas, tty), ProtectSystem=strict + ReadWritePaths lo bloquea. Verificar
# que var/log, var/lib y var/run de Cowrie siguen escribiéndose tras el restart.
[Service]
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=/home/cowrie/cowrie
ReadWritePaths=/home/cowrie/cowrie/var /home/cowrie/cowrie/etc
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
# W^X desactivado a propósito: ctypes/cffi (cryptography) generan trampolines ejecutables.
MemoryDenyWriteExecute=no
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
SystemCallArchitectures=native
UMask=0077
