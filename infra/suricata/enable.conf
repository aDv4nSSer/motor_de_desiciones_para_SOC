# enable.conf -- SIDs L7 experimentales pineados como documentacion de intento
# (Parte A del diseño de deteccion experimental L7/DNS, modo OBSERVACION PURA)
#
# Estos SIDs YA estan activos hoy en /var/lib/suricata/rules/suricata.rules --
# no hay disable.conf en .139 que los filtre. Este archivo no cambia el
# comportamiento actual de Suricata; deja constancia explicita de que
# senales L7 se estan observando a proposito para la tesis, y las protege
# de quedar deshabilitadas por accidente en una actualizacion futura del
# ruleset (suricata-update respeta enable.conf incluso si el upstream
# cambia el estado default de una regla).
#
# Todas son accion "alert" (ninguna drop/reject). Ademas el motor corre en
# modo af-packet puro con copy-mode: none en la interfaz eno2 -- no esta
# insertado en el path de trafico, es estructuralmente incapaz de bloquear
# sin importar la accion de la regla.
#
# Confirmado por lectura directa de /var/lib/suricata/rules/suricata.rules
# el 2026-08-12/13 (ver conversacion de diseño). Requiere `suricata-update`
# + `systemctl restart suricata` para tener efecto sobre una actualizacion
# futura del ruleset -- no se ejecuto ninguno de los dos como parte de este
# cambio, es solo el pin de documentacion.

