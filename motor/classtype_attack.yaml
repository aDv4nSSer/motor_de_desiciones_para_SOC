# classtype_attack.yaml — Mapeo Suricata classtype → MITRE ATT&CK (Enterprise)
#
# Fuente de los classtypes: etc/classification.config oficial de Suricata/OISF
# (github.com/OISF/suricata, rama master), descargado y verificado el 2026-10-05.
# Son 43 classtypes en upstream actual, NO 38 como dice CLAUDE.md — esa cifra
# viene de una versión o config distinta. PENDIENTE: confirmar contra el
# classification.config real desplegado en .139 (probablemente
# /etc/suricata/classification.config) antes de dar esta lista por cerrada,
# porque puede estar recortada o tener entradas propias de ET Open. No
# toqué producción para este archivo — es solo referencia, construida leyendo
# el repo y la documentación pública de ATT&CK.
#
# Cómo leer cada entrada:
#   classtype:    shortname tal como lo emite Suricata (header X-Suricata-Classtype)
#   description:  descripción oficial de classification.config
#   tactic:       táctica ATT&CK Enterprise (ID + nombre), o null si no aplica
#   technique:    técnica/subtécnica más representativa, o null
#   confidence:   "alta" | "media" | "baja" — qué tan bien un classtype por sí
#                 solo predice la técnica. Un classtype es una categoría amplia
#                 de severidad/comportamiento, no una firma 1:1 con una técnica
#                 ATT&CK — varias de estas son multi-técnica por diseño y
#                 quedan en "media" o "baja" a propósito. No tratar esto como
#                 una tabla de verdad absoluta: es el mejor mapeo por defecto,
#                 a usar cuando no hay señal más específica (p. ej. el SID de
#                 la regla, que si trae metadata attack_target/mitre en el
#                 .rules de ET Pro/Open, pesa más que este fallback).
#   notes:        aclaración de por qué el mapeo es ambiguo o no aplica
#
# No usar como fuente única de verdad para T3_CLASSTYPES override en main.py —
# eso es una decisión de severidad operacional ya tomada, distinta de esto.

version: "1.0-borrador"
