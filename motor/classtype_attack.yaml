# classtype_attack.yaml — Mapeo Suricata classtype → MITRE ATT&CK (Enterprise)
#
# v1.1 (6-oct-2026): confirmado contra el classification.config REAL de .139
# (/etc/suricata/classification.config, vía suricata.yaml:2331) por la sesión
# con acceso SSH al laboratorio -- son los mismos 43 classtypes de OISF
# upstream, sin agregados de ET Open, 1 sola diferencia de mayúscula en la
# descripción de web-application-activity ("Access…" acá, "access…" en
# .139 -- no afecta el mapeo). De los 43, 39 tienen al menos una regla
# cargada en suricata.rules; icmp-event, inappropriate-content,
# successful-dos y tcp-connection están definidos pero sin regla activa hoy.
# El "38" de CLAUDE.md no corresponde a esto -- ver la sección "Tiers de
# Decisión y ATT&CK" del propio CLAUDE.md, se refiere a otra cosa (T3_CLASSTYPES
# tiene 7, no 38, y tampoco es esta lista).
#
# Correcciones v1.1 sobre la v1.0 (revisión de código 6-oct):
#   - T1571 Non-Standard Port pertenece a TA0011 Command and Control, no a
#     TA0005 Defense Evasion -- corregido en unusual-client-port-connection
#     y non-standard-protocol.
#   - T1018 Remote System Discovery pertenece a TA0007 Discovery, no a
#     TA0043 Reconnaissance -- corregido en icmp-event.
#   - tactic/technique se separan en *_id/*_name (antes un solo string tipo
#     "T1595 Active Scanning"): Wazuh expone rule.mitre.id como lista de IDs
#     sueltos ("T1110.001"), y cruzar contra eso es más simple con el ID
#     separado del nombre.
#
# Cómo leer cada entrada:
#   classtype:     shortname tal como lo emite Suricata (header X-Suricata-Classtype)
#   description:   descripción oficial de classification.config
#   tactic_id / tactic_name:       táctica ATT&CK Enterprise, o null si no aplica
#   technique_id / technique_name: técnica/subtécnica más representativa, o null
#   confidence:    "alta" | "media" | "baja" — qué tan bien un classtype por sí
#                  solo predice la técnica. Un classtype es una categoría amplia
#                  de severidad/comportamiento, no una firma 1:1 con una técnica
#                  ATT&CK — varias de estas son multi-técnica por diseño y
#                  quedan en "media" o "baja" a propósito. No tratar esto como
#                  una tabla de verdad absoluta: es el mejor mapeo por defecto,
#                  a usar cuando no hay señal más específica (p. ej. el SID de
#                  la regla, que si trae metadata attack_target/mitre en el
#                  .rules de ET Pro/Open, pesa más que este fallback).
#   notes:         aclaración de por qué el mapeo es ambiguo o no aplica
#
# No usar como fuente única de verdad para T3_CLASSTYPES override en main.py —
# eso es una decisión de severidad operacional ya tomada, distinta de esto.
#
# Wazuh ya trae <mitre> nativo en parte de su ruleset (FIM, sudo/su; rootcheck
# casi nada) -- confirmado por la sesión con SSH el 6-oct, 1.053 de 4.505
# reglas, formato rule.mitre.{id,tactic,technique} (listas paralelas) en la
# alerta emitida. Para esas fuentes NO hace falta este mapeo: hay que leer
# el campo que Wazuh ya entrega, no re-derivarlo de un classtype que Wazuh
# ni siquiera usa. Este archivo es solo para la rama Suricata.

