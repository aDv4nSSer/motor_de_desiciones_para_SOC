# ============================================================
# Pipeline Golden Subset v4 — PRODUCCIÓN
# Source: archivo eve.json de Suricata (lectura continua)
# Sink: archivo JSONL rotado por hora
# ============================================================
# Uso: vector --config configs/vector.production.toml
# ============================================================

data_dir = "/home/aiayala/tesis/motor_decisiones_soc/pipeline-ingesta/.vector-data"

# ------------------------------------------------------------
# SOURCE: archivo eve.json de Suricata
# ------------------------------------------------------------
[sources.suricata_eve]
type = "file"
include = ["/var/log/suricata/eve.json"]
read_from = "end"
fingerprint.strategy = "checksum"
fingerprint.bytes = 64
fingerprint.ignored_header_bytes = 0

# ------------------------------------------------------------
# TRANSFORM: VRL Golden Subset v4
# ------------------------------------------------------------
[transforms.parse_eve]
type = "remap"
inputs = ["suricata_eve"]
source = '''
. = parse_json!(.message)

if .event_type != "flow" {
    abort
}

proto_str = string!(.proto)
protocol_raw = if proto_str == "TCP" {
    6
} else if proto_str == "UDP" {
    17
} else if proto_str == "ICMP" {
    1
} else if proto_str == "SCTP" {
    132
} else if proto_str == "GRE" {
    47
} else if proto_str == "IGMP" {
    2
} else if proto_str == "ESP" {
    50
} else if proto_str == "AH" {
    51
} else {
    0
}
.PROTOCOL = if protocol_raw > 89 { 89 } else if protocol_raw < 0 { 0 } else { protocol_raw }

src_port_raw,  _err = int(.src_port  || 0)
dest_port_raw, _err = int(.dest_port || 0)
.L4_SRC_PORT = if src_port_raw  > 65535 { 65535 } else if src_port_raw  < 0 { 0 } else { src_port_raw  }
.L4_DST_PORT = if dest_port_raw > 65535 { 65535 } else if dest_port_raw < 0 { 0 } else { dest_port_raw }

in_bytes_raw  = int!(.flow.bytes_toserver)
in_pkts_raw   = int!(.flow.pkts_toserver)
out_bytes_raw = int!(.flow.bytes_toclient)
out_pkts_raw  = int!(.flow.pkts_toclient)

.IN_BYTES  = if in_bytes_raw  > 94055   { 94055   } else if in_bytes_raw  < 0 { 0 } else { in_bytes_raw  }
.IN_PKTS   = if in_pkts_raw   > 628     { 628     } else if in_pkts_raw   < 0 { 0 } else { in_pkts_raw   }
.OUT_BYTES = if out_bytes_raw > 1466528 { 1466528 } else if out_bytes_raw < 0 { 0 } else { out_bytes_raw }
.OUT_PKTS  = if out_pkts_raw  > 1158    { 1158    } else if out_pkts_raw  < 0 { 0 } else { out_pkts_raw  }

flags_all_raw    = string!(.tcp.tcp_flags    || "00")
flags_client_raw = string!(.tcp.tcp_flags_ts || "00")
flags_server_raw = string!(.tcp.tcp_flags_tc || "00")

flags_all_hex    = if starts_with(flags_all_raw,    "0x") { flags_all_raw    } else { "0x" + flags_all_raw    }
flags_client_hex = if starts_with(flags_client_raw, "0x") { flags_client_raw } else { "0x" + flags_client_raw }
flags_server_hex = if starts_with(flags_server_raw, "0x") { flags_server_raw } else { "0x" + flags_server_raw }

tcp_flags_raw,    _err = parse_int(flags_all_hex)
client_flags_raw, _err = parse_int(flags_client_hex)
server_flags_raw, _err = parse_int(flags_server_hex)

.TCP_FLAGS        = if tcp_flags_raw    > 223 { 223 } else if tcp_flags_raw    < 0 { 0 } else { tcp_flags_raw    }
.CLIENT_TCP_FLAGS = if client_flags_raw > 223 { 223 } else if client_flags_raw < 0 { 0 } else { client_flags_raw }
.SERVER_TCP_FLAGS = if server_flags_raw > 218 { 218 } else if server_flags_raw < 0 { 0 } else { server_flags_raw }

start_ts = .flow.start || null
end_ts   = .flow.end   || null

duration_ms_raw = if start_ts != null && end_ts != null {
    start_ms = to_unix_timestamp(parse_timestamp!(string!(start_ts), "%+"), unit: "milliseconds")
    end_ms   = to_unix_timestamp(parse_timestamp!(string!(end_ts),   "%+"), unit: "milliseconds")
    diff     = end_ms - start_ms
    if diff < 0 { 0 } else { diff }
} else {
    age_sec, _err = int(.flow.age || 0)
    age_sec * 1000
}

.FLOW_DURATION_MILLISECONDS = if duration_ms_raw > 120534 { 120534 } else if duration_ms_raw < 0 { 0 } else { duration_ms_raw }

. = {
    "IPV4_SRC_ADDR":              .src_ip,
    "IPV4_DST_ADDR":              .dest_ip,
    "PROTOCOL":                   .PROTOCOL,
    "L4_SRC_PORT":                .L4_SRC_PORT,
    "L4_DST_PORT":                .L4_DST_PORT,
    "IN_BYTES":                   .IN_BYTES,
    "IN_PKTS":                    .IN_PKTS,
    "OUT_BYTES":                  .OUT_BYTES,
    "OUT_PKTS":                   .OUT_PKTS,
    "TCP_FLAGS":                  .TCP_FLAGS,
    "CLIENT_TCP_FLAGS":           .CLIENT_TCP_FLAGS,
    "SERVER_TCP_FLAGS":           .SERVER_TCP_FLAGS,
    "FLOW_DURATION_MILLISECONDS": .FLOW_DURATION_MILLISECONDS
}
'''

# ------------------------------------------------------------
# SINK 1: archivo JSONL rotado por hora
# ------------------------------------------------------------
[sinks.jsonl_output]
type = "file"
inputs = ["parse_eve"]
path = "/home/aiayala/tesis/motor_decisiones_soc/pipeline-ingesta/outputs/flows_%Y-%m-%d_%H.jsonl"
encoding.codec = "json"

# ------------------------------------------------------------
# SINK 2: consola para monitoreo (comentar en producción)
# ------------------------------------------------------------
[sinks.stdout_monitor]
type = "console"
inputs = ["parse_eve"]
encoding.codec = "json"
# ------------------------------------------------------------
# SINK 3: Motor de Decisiones SOC (FastAPI en .140)
# Fast Path: cada flow enviado para clasificación ML
# ------------------------------------------------------------
[sinks.motor_soc]
type = "http"
inputs = ["parse_eve"]
uri = "http://10.10.10.3:8000/decide"
method = "post"
encoding.codec = "json"
request.timeout_secs = 2
request.retry_attempts = 2

# ------------------------------------------------------------
# TRANSFORM: alertas de Suricata (para correlacion con decisiones
# del motor). Ruta paralela e independiente de parse_eve -- no
# afecta el Fast Path hacia el motor.
# ------------------------------------------------------------
[transforms.parse_eve_alerts]
type = "remap"
inputs = ["suricata_eve"]
source = '''
. = parse_json!(.message)

if .event_type != "alert" {
    abort
}

ts = parse_timestamp!(string!(.timestamp), "%+")

. = {
    "timestamp":     ts,
    "flow_id":       .flow_id,
    "src_ip":        .src_ip,
    "src_port":      .src_port,
    "dest_ip":       .dest_ip,
    "dest_port":     .dest_port,
    "proto":         .proto,
    "signature":     .alert.signature,
    "signature_id":  .alert.signature_id,
    "category":      .alert.category,
    "severity":      .alert.severity,
    "action":        .alert.action
}
'''

# ------------------------------------------------------------
# SINK: alertas de Suricata -> OpenSearch (.140)
# Para correlacionar ataques detectados por firma contra las
# decisiones que tomo el motor sobre el mismo trafico.
# ------------------------------------------------------------
[sinks.suricata_alerts_os]
type = "elasticsearch"
inputs = ["parse_eve_alerts"]
endpoints = ["https://10.10.10.3:9201"]
mode = "bulk"
api_version = "v7"
bulk.index = "suricata-alerts-%Y.%m.%d"
auth.strategy = "basic"
auth.user = "admin"
auth.password = "${OS_PASS}"
tls.verify_certificate = false
