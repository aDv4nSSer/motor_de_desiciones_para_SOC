# ============================================================
# Pipeline Golden Subset - Fase 1 (desarrollo con stdin)
# Source: stdin (pegamos EVE JSON por entrada estándar)
# Transform: VRL del Golden Subset
# Sink: consola (stdout)
# ============================================================

data_dir = "/home/aiayala/documents/tesis/motor_de_desiciones_para_SOC/pipeline-ingesta/.vector-data"

[sources.eve_stdin]
type = "stdin"

[transforms.parse_eve]
type = "remap"
inputs = ["eve_stdin"]
source = '''
# Paso 1: parsear la línea cruda como JSON
. = parse_json!(.message)

# Paso 2: PROTOCOL — mapear string canónico a entero NetFlow
proto_str = string!(.proto)
.PROTOCOL = if proto_str == "TCP" {
    6
} else if proto_str == "UDP" {
    17
} else if proto_str == "ICMP" {
    1
} else if proto_str == "ICMP6" {
    58
} else if proto_str == "GRE" {
    47
} else {
    0
}

# Paso 3: Bytes y paquetes (extracción directa con casteo a int)
.IN_BYTES  = int!(.flow.bytes_toserver)
.IN_PKTS   = int!(.flow.pkts_toserver)
.OUT_BYTES = int!(.flow.bytes_toclient)
.OUT_PKTS  = int!(.flow.pkts_toclient)

# Paso 4: TCP flags — hex string a int, default "0x00" para no-TCP
flags_all    = .tcp.tcp_flags    || "0x00"
flags_client = .tcp.tcp_flags_ts || "0x00"
flags_server = .tcp.tcp_flags_tc || "0x00"

.TCP_FLAGS        = parse_int!(flags_all)
.CLIENT_TCP_FLAGS = parse_int!(flags_client)
.SERVER_TCP_FLAGS = parse_int!(flags_server)

# Paso 5: FLOW_DURATION_MILLISECONDS (precisión sub-segundo)
start_ms = to_unix_timestamp(parse_timestamp!(.flow.start, "%+"), unit: "milliseconds")
end_ms   = to_unix_timestamp(parse_timestamp!(.flow.end,   "%+"), unit: "milliseconds")
duration_ms = end_ms - start_ms
.FLOW_DURATION_MILLISECONDS = if duration_ms < 0 { 0 } else { duration_ms }

# Paso 6: Throughput por segundo en cada dirección
# División por cero protegida: la guarda if==0 evita el caso problemático.
# El "_, err" le dice al compilador que sabemos que la división puede ser
# falible y aceptamos manejar el error (que en la práctica nunca ocurre
# porque la guarda lo previene).
.SRC_TO_DST_SECOND_BYTES, _err = if .FLOW_DURATION_MILLISECONDS == 0 {
    0.0
} else {
    to_float(.IN_BYTES) / (to_float(.FLOW_DURATION_MILLISECONDS) / 1000.0)
}

.DST_TO_SRC_SECOND_BYTES, _err = if .FLOW_DURATION_MILLISECONDS == 0 {
    0.0
} else {
    to_float(.OUT_BYTES) / (to_float(.FLOW_DURATION_MILLISECONDS) / 1000.0)
}

# Paso 7: salida limpia — solo las 11 features del Golden Subset
. = {
    "PROTOCOL":                   .PROTOCOL,
    "IN_BYTES":                   .IN_BYTES,
    "IN_PKTS":                    .IN_PKTS,
    "OUT_BYTES":                  .OUT_BYTES,
    "OUT_PKTS":                   .OUT_PKTS,
    "TCP_FLAGS":                  .TCP_FLAGS,
    "CLIENT_TCP_FLAGS":           .CLIENT_TCP_FLAGS,
    "SERVER_TCP_FLAGS":           .SERVER_TCP_FLAGS,
    "FLOW_DURATION_MILLISECONDS": .FLOW_DURATION_MILLISECONDS,
    "SRC_TO_DST_SECOND_BYTES":    .SRC_TO_DST_SECOND_BYTES,
    "DST_TO_SRC_SECOND_BYTES":    .DST_TO_SRC_SECOND_BYTES
}
'''

[sinks.stdout]
type = "console"
inputs = ["parse_eve"]
encoding.codec = "json"

# ============================================================
# UNIT TESTS
# Ejecutar: vector test configs/vector.toml
# Cada test cubre un caso representativo del Golden Subset.
# ============================================================

# -- Test 1: TCP normal con todos los campos presentes ------
[[tests]]
name = "tcp_normal_full_fields"

  [[tests.inputs]]
  insert_at = "parse_eve"
  type = "log"

    [tests.inputs.log_fields]
    message = '{"timestamp":"2026-05-15T10:23:45.123456+0000","event_type":"flow","proto":"TCP","flow":{"start":"2026-05-15T10:23:44.000000+0000","end":"2026-05-15T10:23:45.123456+0000","bytes_toserver":1240,"pkts_toserver":8,"bytes_toclient":5680,"pkts_toclient":12},"tcp":{"tcp_flags":"0x1b","tcp_flags_tc":"0x02","tcp_flags_ts":"0x12"}}'

  [[tests.outputs]]
  extract_from = "parse_eve"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert_eq!(.PROTOCOL, 6)
    assert_eq!(.IN_BYTES, 1240)
    assert_eq!(.IN_PKTS, 8)
    assert_eq!(.OUT_BYTES, 5680)
    assert_eq!(.OUT_PKTS, 12)
    assert_eq!(.TCP_FLAGS, 27)
    assert_eq!(.CLIENT_TCP_FLAGS, 18)
    assert_eq!(.SERVER_TCP_FLAGS, 2)
    assert_eq!(.FLOW_DURATION_MILLISECONDS, 1123)
    '''

# -- Test 2: UDP sin objeto tcp ------------------------------
[[tests]]
name = "udp_no_tcp_object"

  [[tests.inputs]]
  insert_at = "parse_eve"
  type = "log"

    [tests.inputs.log_fields]
    message = '{"timestamp":"2026-05-15T10:25:00.500000+0000","event_type":"flow","proto":"UDP","flow":{"start":"2026-05-15T10:24:59.000000+0000","end":"2026-05-15T10:25:00.500000+0000","bytes_toserver":80,"pkts_toserver":1,"bytes_toclient":160,"pkts_toclient":1}}'

  [[tests.outputs]]
  extract_from = "parse_eve"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert_eq!(.PROTOCOL, 17)
    assert_eq!(.TCP_FLAGS, 0)
    assert_eq!(.CLIENT_TCP_FLAGS, 0)
    assert_eq!(.SERVER_TCP_FLAGS, 0)
    assert_eq!(.FLOW_DURATION_MILLISECONDS, 1500)
    '''

# -- Test 3: ICMP sin objeto tcp -----------------------------
[[tests]]
name = "icmp_no_tcp_object"

  [[tests.inputs]]
  insert_at = "parse_eve"
  type = "log"

    [tests.inputs.log_fields]
    message = '{"timestamp":"2026-05-15T10:26:00.000000+0000","event_type":"flow","proto":"ICMP","flow":{"start":"2026-05-15T10:25:58.000000+0000","end":"2026-05-15T10:26:00.000000+0000","bytes_toserver":84,"pkts_toserver":1,"bytes_toclient":84,"pkts_toclient":1}}'

  [[tests.outputs]]
  extract_from = "parse_eve"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert_eq!(.PROTOCOL, 1)
    assert_eq!(.TCP_FLAGS, 0)
    assert_eq!(.FLOW_DURATION_MILLISECONDS, 2000)
    assert_eq!(.SRC_TO_DST_SECOND_BYTES, 42.0)
    assert_eq!(.DST_TO_SRC_SECOND_BYTES, 42.0)
    '''

# -- Test 4: TCP SYN parcial (sin tcp_flags_tc) --------------
[[tests]]
name = "tcp_syn_partial_flags"

  [[tests.inputs]]
  insert_at = "parse_eve"
  type = "log"

    [tests.inputs.log_fields]
    message = '{"timestamp":"2026-05-15T10:27:30.999000+0000","event_type":"flow","proto":"TCP","flow":{"start":"2026-05-15T10:27:30.000000+0000","end":"2026-05-15T10:27:30.999000+0000","bytes_toserver":74,"pkts_toserver":1,"bytes_toclient":0,"pkts_toclient":0},"tcp":{"tcp_flags":"0x02","tcp_flags_ts":"0x02"}}'

  [[tests.outputs]]
  extract_from = "parse_eve"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert_eq!(.PROTOCOL, 6)
    assert_eq!(.TCP_FLAGS, 2)
    assert_eq!(.CLIENT_TCP_FLAGS, 2)
    assert_eq!(.SERVER_TCP_FLAGS, 0)
    assert_eq!(.FLOW_DURATION_MILLISECONDS, 999)
    assert_eq!(.DST_TO_SRC_SECOND_BYTES, 0.0)
    '''

# -- Test 5: Duración cero — guarda de división por cero -----
[[tests]]
name = "zero_duration_division_guard"

  [[tests.inputs]]
  insert_at = "parse_eve"
  type = "log"

    [tests.inputs.log_fields]
    message = '{"timestamp":"2026-05-15T10:28:00.000000+0000","event_type":"flow","proto":"TCP","flow":{"start":"2026-05-15T10:28:00.000000+0000","end":"2026-05-15T10:28:00.000000+0000","bytes_toserver":0,"pkts_toserver":0,"bytes_toclient":0,"pkts_toclient":0},"tcp":{"tcp_flags":"0x00"}}'

  [[tests.outputs]]
  extract_from = "parse_eve"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
    assert_eq!(.FLOW_DURATION_MILLISECONDS, 0)
    assert_eq!(.SRC_TO_DST_SECOND_BYTES, 0.0)
    assert_eq!(.DST_TO_SRC_SECOND_BYTES, 0.0)
    '''
